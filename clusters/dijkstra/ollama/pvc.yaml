apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-pvc
  namespace: ollama
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs
  volumeMode: Filesystem
  resources:
    requests:
      storage: 100Gi
  volumeName: ollama-models-pv

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data-pvc
  namespace: ollama
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  volumeMode: Filesystem
  resources:
    requests:
      storage: 5Gi
  volumeName: ollama-data-pv
