apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kedacore
  namespace: keda
spec:
  interval: 1h
  url: https://kedacore.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: keda
spec:
  interval: 30m
  chart:
    spec:
      chart: keda
      version: 2.21.0
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: keda
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    resources:
      operator:
        requests:
          cpu: "20m"
          memory: "64Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
      metricServer:
        requests:
          cpu: "20m"
          memory: "64Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
      webhooks:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "300m"
          memory: "128Mi"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda-add-ons-http
  namespace: keda
spec:
  interval: 30m
  dependsOn:
    - name: keda
  chart:
    spec:
      chart: keda-add-ons-http
      version: 0.16.0
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: keda
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    interceptor:
      replicas:
        min: 1
        max: 1
      readinessTimeout: 120s
      pdb:
        enabled: false
      resources:
        requests:
          cpu: "20m"
          memory: "32Mi"
        limits:
          cpu: "500m"
          memory: "128Mi"
