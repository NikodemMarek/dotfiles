apiVersion: v1
kind: PersistentVolume
metadata:
  name: velero-backups-pv
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  nfs:
    server: 100.110.221.34
    path: /mnt/backups
  mountOptions:
    - actimeo=300
    - noatime
    - nodiratime
    - hard
    - timeo=600
    - retrans=2
