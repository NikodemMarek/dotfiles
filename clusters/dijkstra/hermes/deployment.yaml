apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      nodeSelector:
        kubernetes.io/hostname: triss
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data-pvc
        - name: ssh-key
          secret:
            secretName: secrets
            items:
              - key: ssh_ed25519_priv
                path: id_ed25519
            defaultMode: 0440
        - name: ssh-config
          configMap:
            name: hermes-ssh-config
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:latest
          args: ["gateway", "run"]
          ports:
            - containerPort: 8642
            - containerPort: 9119
          env:
            - name: HERMES_DASHBOARD
              value: "true"
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_CORS_ORIGINS
              value: "*"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: api_server_key
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: ssh-key
              mountPath: /opt/data/.ssh/id_ed25519
              subPath: id_ed25519
              readOnly: true
            - name: ssh-config
              mountPath: /opt/data/.ssh/known_hosts
              subPath: known_hosts
              readOnly: true
          resources:
            requests:
              memory: "1Gi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "800m"
