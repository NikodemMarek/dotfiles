apiVersion: v1
kind: Service
metadata:
  name: hermes-gateway-service
  namespace: hermes
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "hermes-gateway"
spec:
  type: ClusterIP
  selector:
    app: hermes
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8642
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-dashboard-service
  namespace: hermes
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "hermes-dashboard"
spec:
  type: ClusterIP
  selector:
    app: hermes
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9119
