apiVersion: v1
kind: PersistentVolume
metadata:
  name: arrstack-shows-pv
spec:
  capacity:
    storage: 200Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  nfs:
    server: 100.110.221.34
    path: /mnt/shows
  mountOptions:
    - actimeo=300
    - noatime
    - nodiratime
