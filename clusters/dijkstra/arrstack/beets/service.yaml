# Backend service the KEDA interceptor forwards to.
apiVersion: v1
kind: Service
metadata:
  name: beets-app
  namespace: arrstack
  labels:
    app: beets
spec:
  selector:
    app: beets
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
---
# Keeps the in-cluster name working; traffic goes through the interceptor so it can wake the app.
apiVersion: v1
kind: Service
metadata:
  name: beets
  namespace: arrstack
  annotations:
    # Recreate instead of failing on the ClusterIP -> ExternalName change.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  type: ExternalName
  externalName: arrstack-interceptor.keda.svc.cluster.local
