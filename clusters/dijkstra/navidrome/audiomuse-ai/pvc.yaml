apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiomuse-ai-release-postgres-pvc
  namespace: navidrome
  labels:
    recurring-job-group.longhorn.io/default: "enabled"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiomuse-ai-release-postgres-openebs-mig
  namespace: navidrome
  labels:
    recurring-job-group.longhorn.io/default: "enabled"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 5Gi
