apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: audiomuse-ai-repo
  namespace: navidrome
spec:
  interval: 10m0s
  url: https://NeptuneHub.github.io/AudioMuse-AI-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: audiomuse-ai-release
  namespace: navidrome
spec:
  chart:
    spec:
      chart: audiomuse-ai
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: audiomuse-ai-repo
      version: v1.1.6
  interval: 10m0s
  values:
    redis:
      replicaCount: 0
    postgres:
      replicaCount: 0
    worker:
      replicaCount: 0
    flask:
      replicaCount: 0
  valuesFrom:
    - kind: ConfigMap
      name: audiomuse-ai-config
      valuesKey: values.yaml
    - kind: Secret
      name: secrets
      valuesKey: audiomuse_navidrome_user
      targetPath: navidrome.user
    - kind: Secret
      name: secrets
      valuesKey: audiomuse_navidrome_password
      targetPath: navidrome.password
